# This website is buildless; its deployable files are already in dist.
[build]
  base = "."
  publish = "dist"
  command = ""

[[redirects]]
  from = "http://alderivecareers.com/*"
  to = "https://alderivecareers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.alderivecareers.com/*"
  to = "https://alderivecareers.com/:splat"
  status = 301
  force = true
